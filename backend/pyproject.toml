[project]
name = "monitoring-failure-prediction-backend"
version = "0.1.0"
description = "Backend API: ingestion, health, and (later) failure-prediction model serving."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "aiokafka>=0.12,<0.13",
    "pandas>=3.0,<4",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires real TimescaleDB/Redpanda (run against docker compose)",
]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
