x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@timescaledb:5432/${POSTGRES_DB:-monitoring}
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092

services:
  redpanda:
    image: redpandadata/redpanda:v22.2.4
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:${REDPANDA_EXTERNAL_PORT:-19092}
    ports:
      - "127.0.0.1:${REDPANDA_EXTERNAL_PORT:-19092}:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  timescaledb:
    image: timescale/timescaledb:2.30.1-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-monitoring}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-monitoring}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      <<: *backend-env
      MODEL_PATH: /app/models/isolation_forest.joblib
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./models:/app/models:ro
    depends_on:
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ./backend
      target: dev
    command: ["python", "-m", "app.ingestion.migrate"]
    environment:
      <<: *backend-env
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  producer:
    build:
      context: ./backend
      target: dev
    command: ["python", "-m", "app.ingestion.producer"]
    environment:
      <<: *backend-env
      NAB_DATA_DIR: /data
      REPLAY_SPEED: ${REPLAY_SPEED:-0}
    volumes:
      - ./data:/data:ro
    depends_on:
      redpanda:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  consumer:
    build:
      context: ./backend
      target: dev
    command: ["python", "-m", "app.ingestion.consumer"]
    environment:
      <<: *backend-env
    depends_on:
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  redpanda_data:
  timescaledb_data:
